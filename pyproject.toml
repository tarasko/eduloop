[project]
name = "eduloop"
description = "Minimalistic asyncio compatible event loop for educational purposes."
authors = [{name = "Taras Kozlov", email = "tarasko.projects@gmail.com"}]
requires-python = '>=3.11'
readme = "README.md"
version = "0.0.1"
classifiers = [
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15'
]

[build-system]
requires = ["setuptools >= 78.0"]
dependencies = ["aiofastnet", "aiodns", "picows"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["slides", "examples"]
